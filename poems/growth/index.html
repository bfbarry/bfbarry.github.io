    <h2>Growing Fast and Slow (dual haiku)</h2>
  
  <p>(1)<br>
Slow growth works the best<br>
When the reps are so lightweight<br>
That it barely stings</p>
<p>(2)<br>
Fast growth needs a tip -<br>
Or trick - to bring on a click<br>
That sticks, forever</p>
