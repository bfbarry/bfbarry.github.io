    <h2>Speck</h2>
  
  <p>I am the wind through the trees<br>
In no hurry of need<br>
I am the water on the sand<br>
It stirs as I land</p>
<p>I am a leaf on the branch<br>
Is this an avalanche?<br>
I am a grain in the wave<br>
Forever displaced</p>
