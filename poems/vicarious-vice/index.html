  <p class="poem-year">2026</p>
  
    <h2>Vicarious Vice</h2>
  
  <p>I sit at home<br>
yet live a thousand lives</p>
<p>A bath of media overload<br>
Buzzing like a hive</p>
<p>For my ear, more love songs<br>
Feelings on streaming</p>
<p>In my eyes, more fun<br>
On my mind: nothing</p>
<p>You can douse the flame<br>
daily</p>
<p>Or reject the same<br>
and flee</p>
